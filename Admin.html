<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1624">
<link rel="apple-touch-icon" href="connectup-icon-192.png">
<link rel="icon" href="connectup-icon-192.png">
<title>ConnectUp Admin</title>
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t);var a=localStorage.getItem("accent");if(a)document.documentElement.style.setProperty("--accent",a);}catch(e){}</script>
<style>
  :root { --bg:#0f1624; --surface:#182236; --text:#e8eefb; --muted:#9aaac4; --accent:#6c9bff; --border:#2a3855; --danger:#ff7b7b; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg:#f3f6fb; --surface:#fff; --text:#14213d; --muted:#5b6b86; --accent:#2457d6; --border:#dbe3f0; --danger:#c62f2f; }
  }
  :root[data-theme="light"] { --bg:#f3f6fb; --surface:#fff; --text:#14213d; --muted:#5b6b86; --accent:#2457d6; --border:#dbe3f0; --danger:#c62f2f; }
  :root[data-theme="dark"] { --bg:#0f1624; --surface:#182236; --text:#e8eefb; --muted:#9aaac4; --accent:#6c9bff; --border:#2a3855; --danger:#ff7b7b; }
  * { box-sizing: border-box; }
  body { margin:0; padding-bottom:70px; font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  header { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:5; }
  header h1 { font-size:1.15rem; margin:0; }
  main { max-width:640px; margin:0 auto; padding:18px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:14px; }
  textarea, .cinput { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
  button { padding:9px 16px; border-radius:8px; font-size:.95rem; cursor:pointer; border:1px solid var(--accent); background:var(--accent); color:#fff; }
  button.ghost { background:none; color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  button:focus-visible, textarea:focus-visible, input:focus-visible, a:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .av { width:42px; height:42px; border-radius:50%; object-fit:cover; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:600; flex-shrink:0; }
  .muted, .handle, .time { color:var(--muted); font-size:.85rem; }
  .author { font-weight:600; }
  .rowline { display:flex; gap:12px; align-items:center; }
  .grow { flex:1; min-width:0; }
  #loading, .emptymsg { text-align:center; color:var(--muted); padding:40px 0; }
  #app { display:none; }
  .tabbar { position:fixed; left:0; right:0; bottom:0; display:flex; background:var(--surface); border-top:1px solid var(--border); padding-bottom:env(safe-area-inset-bottom,0px); }
  .tabbar a { flex:1; position:relative; text-align:center; padding:14px 0; color:var(--muted); text-decoration:none; font-size:.72rem; }
  .tabbar a.active { color:var(--accent); font-weight:600; }
  .badge { position:absolute; top:6px; left:calc(50% + 8px); background:var(--danger); color:#fff; border-radius:10px; font-size:.65rem; padding:1px 5px; display:none; }

  .small { font-size:.85rem; }
  .row3 { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .dangerbtn { background:none; color:var(--danger); border-color:var(--danger); }
  .quote { border-left:3px solid var(--border); padding-left:10px; margin:8px 0; white-space:pre-wrap; word-wrap:break-word; }
</style>
</head>
<body>

<div id="loading">Loading…</div>

<div id="app">
  <header><h1>Admin</h1></header>
  <main>
    <div id="denied" class="emptymsg" style="display:none">This page is for admins only.</div>
    <div id="adminArea" style="display:none">
      <h3>Reports</h3>
      <div id="reports"></div>
      <div id="rnone" class="emptymsg" style="display:none">No open reports.</div>
      <h3>Sponsored posts</h3>
      <div class="card">
        <input id="adBrand" class="cinput" maxlength="60" placeholder="Advertiser name">
        <textarea id="adText" class="cinput" maxlength="200" rows="3" placeholder="Ad text (max 200 characters)" style="margin-top:8px"></textarea>
        <input id="adLink" class="cinput" placeholder="Link (https://...)" style="margin-top:8px">
        <input id="adFile" type="file" accept="image/*" hidden>
        <img id="adPrev" alt="" style="display:none;max-width:100%;border-radius:10px;margin-top:8px">
        <div class="row3"><button class="ghost" id="adImgBtn">Add image</button><button id="adSaveBtn">Publish ad</button></div>
        <p class="muted small" id="adMsg"></p>
      </div>
      <div id="adsList"></div>
      <h3>Verified members</h3>
      <div class="card">
        <input id="vUser" class="cinput" placeholder="Username (or user ID)">
        <select id="vDays" class="cinput" style="margin-top:8px">
          <option value="30">30 days</option><option value="90">90 days</option><option value="365">1 year</option>
        </select>
        <button id="vBtn" style="margin-top:10px">Grant verified badge</button>
        <p class="muted small" id="vMsg"></p>
      </div>
      <div id="vList"></div>
      <h3>Banned users</h3>
      <div class="card">
        <input id="banUid" class="cinput" placeholder="User ID to ban">
        <input id="banReason" class="cinput" placeholder="Reason (optional)" style="margin-top:8px">
        <button class="dangerbtn" id="banBtn" style="margin-top:10px">Ban user</button>
        <p class="muted small" id="banMsg"></p>
      </div>
      <div id="banned"></div>
    </div>
  </main>
</div>

<nav class="tabbar">
  <a href="Feed.html">Feed</a>
  <a href="Search.html">Search</a>
  <a href="Groups.html">Groups</a>
  <a href="Messages.html">Chat</a>
  <a href="Alerts.html">Alerts<span class="badge" id="alertBadge"></span></a>
  <a href="Home.html" class="active">Profile</a>
</nav>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, updateProfile, signOut, EmailAuthProvider,
           reauthenticateWithCredential, deleteUser }
    from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
  import { initializeFirestore, collection, addDoc, deleteDoc, doc, getDoc, getDocs, setDoc,
           updateDoc, query, where, orderBy, limit, onSnapshot, arrayUnion, arrayRemove }
    from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

  const firebaseConfig = {
  apiKey: "AIzaSyASt_xJLUPi1pFcvN1ZicL1Gj5_x1IuXX8",
  authDomain: "connectup-db617.firebaseapp.com",
  projectId: "connectup-db617",
  storageBucket: "connectup-db617.firebasestorage.app",
  messagingSenderId: "174771443294",
  appId: "1:174771443294:web:28dcb5d14491e717a286cf",
  measurementId: "G-YMRMYF20D7"
};

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = initializeFirestore(app, { experimentalForceLongPolling: true });
  const $ = (id) => document.getElementById(id);

  function watchBadge(uid) {
    const q = query(collection(db, "notifications"), where("to", "==", uid), where("read", "==", false));
    onSnapshot(q, (s) => {
      const b = document.getElementById("alertBadge");
      if (!b) return;
      b.textContent = s.size > 9 ? "9+" : s.size;
      b.style.display = s.size ? "block" : "none";
    }, () => {});
  }

  function avatarEl(avatar, name) {
    if (avatar) {
      const img = document.createElement("img");
      img.className = "av"; img.src = avatar; img.alt = "";
      return img;
    }
    const d = document.createElement("div");
    d.className = "av";
    d.textContent = (name || "?").charAt(0).toUpperCase();
    return d;
  }

  async function loadMe(user) {
    let name = user.displayName || "";
    let username = localStorage.getItem("username") || "";
    let avatar = "";
    let blocked = [];
    let bio = "";
    try {
      const s = await getDoc(doc(db, "users", user.uid));
      if (s.exists()) {
        const d = s.data();
        name = d.name || name; username = d.username || username; avatar = d.avatar || "";
        blocked = d.blocked || []; bio = d.bio || "";
      }
    } catch (e) { console.error(e); }
    return { uid: user.uid, name, username, avatar, blocked, bio, email: user.email };
  }

  function notify(me, to, type, postId, text) {
    if (!to || to === me.uid) return;
    addDoc(collection(db, "notifications"), {
      to, from: me.uid, fromName: me.name || me.username || "Someone",
      type, postId: postId || "", text: text || "", createdAt: Date.now(), read: false
    }).catch(() => {});
  }

  function timeAgo(ms) {
    if (!ms) return "just now";
    const s = Math.floor((Date.now() - ms) / 1000);
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s / 60) + " min ago";
    if (s < 86400) return Math.floor(s / 3600) + " h ago";
    return new Date(ms).toLocaleDateString();
  }

  let me = null;
  const cache = new Map();
  async function getUser(uid) {
    if (cache.has(uid)) return cache.get(uid);
    let name = uid;
    try { const s = await getDoc(doc(db, "users", uid)); if (s.exists()) name = (s.data().name || s.data().username || uid) + (s.data().username ? " (@" + s.data().username + ")" : ""); } catch (e) {}
    cache.set(uid, name);
    return name;
  }
  async function ban(uid, reason) {
    await setDoc(doc(db, "banned", uid), { by: me.uid, reason: reason || "", createdAt: Date.now() });
  }

  async function renderReports(docs) {
    const box = $("reports");
    const items = docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => b.createdAt - a.createdAt);
    const rows = await Promise.all(items.map(async (r) => {
      let post = null;
      try { const p = await getDoc(doc(db, "posts", r.postId)); if (p.exists()) post = p.data(); } catch (e) {}
      return { r, post, author: await getUser(r.postUid) };
    }));
    box.innerHTML = "";
    rows.forEach(({ r, post, author }) => {
      const card = document.createElement("div");
      card.className = "card";
      const h = document.createElement("div");
      h.innerHTML = "";
      const title = document.createElement("div");
      title.style.fontWeight = "600"; title.textContent = "Reported post by " + author;
      const why = document.createElement("div");
      why.className = "muted small"; why.textContent = "Reason: " + r.reason + " · " + timeAgo(r.createdAt);
      const q = document.createElement("div");
      q.className = "quote"; q.textContent = post ? (post.text || "(photo or video only)") : "(post already deleted)";
      card.append(title, why, q);
      const btns = document.createElement("div");
      btns.className = "row3";
      if (post) {
        const dp = document.createElement("button");
        dp.className = "dangerbtn"; dp.textContent = "Delete post";
        dp.onclick = async () => { if (!confirm("Delete this post?")) return; try { await deleteDoc(doc(db, "posts", r.postId)); await deleteDoc(doc(db, "reports", r.id)); } catch (e) { alert("Failed: " + (e.code || e.message)); } };
        btns.appendChild(dp);
      }
      const bu = document.createElement("button");
      bu.className = "dangerbtn"; bu.textContent = "Ban author";
      bu.onclick = async () => { if (!confirm("Ban this user from posting?")) return; try { await ban(r.postUid, r.reason); alert("User banned."); } catch (e) { alert("Failed: " + (e.code || e.message)); } };
      const ds = document.createElement("button");
      ds.className = "ghost"; ds.textContent = "Dismiss";
      ds.onclick = async () => { try { await deleteDoc(doc(db, "reports", r.id)); } catch (e) { alert("Failed."); } };
      btns.append(bu, ds);
      card.appendChild(btns);
      box.appendChild(card);
    });
    $("rnone").style.display = rows.length ? "none" : "block";
  }

  async function renderBanned(docs) {
    const box = $("banned");
    const rows = await Promise.all(docs.map(async (d) => ({ id: d.id, data: d.data(), name: await getUser(d.id) })));
    box.innerHTML = "";
    rows.forEach(({ id, data, name }) => {
      const card = document.createElement("div");
      card.className = "card";
      const t = document.createElement("div");
      t.textContent = name;
      const w = document.createElement("div");
      w.className = "muted small"; w.textContent = data.reason ? "Reason: " + data.reason : "No reason given";
      const u = document.createElement("button");
      u.className = "ghost"; u.style.marginTop = "8px"; u.textContent = "Unban";
      u.onclick = async () => { try { await deleteDoc(doc(db, "banned", id)); } catch (e) { alert("Failed."); } };
      card.append(t, w, u);
      box.appendChild(card);
    });
  }

  $("banBtn").onclick = async () => {
    const uid = $("banUid").value.trim();
    if (!uid) return;
    try { await ban(uid, $("banReason").value.trim()); $("banMsg").textContent = "Banned."; $("banUid").value = ""; $("banReason").value = ""; }
    catch (e) { $("banMsg").textContent = "Failed: " + (e.code || e.message); }
  };

  // ---------- Sponsored posts ----------
  let adImage = "";
  function compressImg(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const sc = Math.min(1, 800 / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", 0.7));
      };
      img.onerror = () => reject(new Error("bad image"));
      img.src = url;
    });
  }
  $("adImgBtn").onclick = () => $("adFile").click();
  $("adFile").onchange = async () => {
    const f = $("adFile").files[0];
    if (!f) return;
    try {
      const d = await compressImg(f);
      if (d.length > 450000) { $("adMsg").textContent = "That image is too large."; return; }
      adImage = d;
      $("adPrev").src = d; $("adPrev").style.display = "block";
    } catch (e) { $("adMsg").textContent = "Could not read that image."; }
  };
  $("adSaveBtn").onclick = async () => {
    const brand = $("adBrand").value.trim();
    const text = $("adText").value.trim();
    const link = $("adLink").value.trim();
    if (!brand || !text) { $("adMsg").textContent = "Add the advertiser name and the ad text."; return; }
    if (link && !/^https:\/\//i.test(link)) { $("adMsg").textContent = "The link must start with https://"; return; }
    try {
      await addDoc(collection(db, "sponsored"), { brand, text, link, image: adImage, active: true, createdAt: Date.now(), by: me.uid });
      $("adBrand").value = ""; $("adText").value = ""; $("adLink").value = "";
      adImage = ""; $("adPrev").style.display = "none";
      $("adMsg").textContent = "Ad published. It appears after every 5th post in the feed.";
    } catch (e) { $("adMsg").textContent = "Failed: " + (e.code || e.message); }
  };

  async function renderAdsList(docs) {
    const rows = await Promise.all(docs.map(async (d) => {
      let clicks = 0;
      try { clicks = (await getDocs(query(collection(db, "adClicks"), where("adId", "==", d.id), limit(1000)))).size; } catch (e) {}
      return { id: d.id, ...d.data(), clicks };
    }));
    rows.sort((x, y) => y.createdAt - x.createdAt);
    const box = $("adsList");
    box.innerHTML = "";
    rows.forEach((ad) => {
      const card = document.createElement("div");
      card.className = "card";
      const t = document.createElement("div");
      t.style.fontWeight = "600"; t.textContent = ad.brand + (ad.active ? "" : "  (paused)");
      const x = document.createElement("div");
      x.className = "quote"; x.textContent = ad.text;
      const st = document.createElement("div");
      st.className = "muted small"; st.textContent = ad.clicks + " clicks · " + timeAgo(ad.createdAt);
      const btns = document.createElement("div");
      btns.className = "row3";
      const pb = document.createElement("button");
      pb.className = "ghost"; pb.textContent = ad.active ? "Pause" : "Activate";
      pb.onclick = async () => { try { await updateDoc(doc(db, "sponsored", ad.id), { active: !ad.active }); } catch (e) { alert("Failed."); } };
      const db2 = document.createElement("button");
      db2.className = "dangerbtn"; db2.textContent = "Delete";
      db2.onclick = async () => { if (!confirm("Delete this ad?")) return; try { await deleteDoc(doc(db, "sponsored", ad.id)); } catch (e) { alert("Failed."); } };
      btns.append(pb, db2);
      card.append(t, x, st, btns);
      box.appendChild(card);
    });
  }
  function watchAds() {
    onSnapshot(query(collection(db, "sponsored"), limit(50)), (s) => renderAdsList(s.docs), () => {});
  }

  // ---------- Verified members ----------
  async function resolveUid(input) {
    const v = input.trim();
    if (!v) return "";
    try { const u = await getDoc(doc(db, "usernames", v.toLowerCase())); if (u.exists()) return u.data().uid; } catch (e) {}
    return v;
  }
  $("vBtn").onclick = async () => {
    const uid = await resolveUid($("vUser").value);
    if (!uid) { $("vMsg").textContent = "Enter a username or user ID."; return; }
    try {
      const u = await getDoc(doc(db, "users", uid));
      if (!u.exists()) { $("vMsg").textContent = "User not found."; return; }
      let start = Date.now();
      const ex = await getDoc(doc(db, "premium", uid));
      if (ex.exists() && (ex.data().until || 0) > start) start = ex.data().until;
      const until = start + Number($("vDays").value) * 86400000;
      await setDoc(doc(db, "premium", uid), { until, by: me.uid, createdAt: Date.now() });
      $("vMsg").textContent = "Verified until " + new Date(until).toLocaleDateString() + ".";
      $("vUser").value = "";
    } catch (e) { $("vMsg").textContent = "Failed: " + (e.code || e.message); }
  };
  function watchVerified() {
    onSnapshot(query(collection(db, "premium"), limit(200)), async (s) => {
      const rows = await Promise.all(s.docs.map(async (d) => ({ id: d.id, until: d.data().until || 0, name: await getUser(d.id) })));
      rows.sort((a, b) => b.until - a.until);
      const box = $("vList");
      box.innerHTML = "";
      rows.forEach((r) => {
        const card = document.createElement("div");
        card.className = "card";
        const t = document.createElement("div");
        t.textContent = r.name + (r.until > Date.now() ? "" : "  (expired)");
        const w = document.createElement("div");
        w.className = "muted small"; w.textContent = "Until " + new Date(r.until).toLocaleDateString();
        const rm = document.createElement("button");
        rm.className = "ghost"; rm.style.marginTop = "8px"; rm.textContent = "Remove";
        rm.onclick = async () => { try { await deleteDoc(doc(db, "premium", r.id)); } catch (e) { alert("Failed."); } };
        card.append(t, w, rm);
        box.appendChild(card);
      });
    }, () => {});
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = "index.html"; return; }
    me = await loadMe(user);
    watchBadge(user.uid);
    $("loading").style.display = "none";
    $("app").style.display = "block";
    let admin = false;
    try { admin = (await getDoc(doc(db, "admins", me.uid))).exists(); } catch (e) {}
    if (!admin) { $("denied").style.display = "block"; return; }
    $("adminArea").style.display = "block";
    watchAds();
    watchVerified();
    onSnapshot(query(collection(db, "reports"), limit(100)), (s) => renderReports(s.docs), () => {});
    onSnapshot(query(collection(db, "banned"), limit(100)), (s) => renderBanned(s.docs), () => {});
  });
</script>

<script type="module" src="consent.js"></script>
</body>
</html>
